name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnome-shell-common libglib2.0-bin gnome-shell
      - run: make pack
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.shell-extension.zip
          generate_release_notes: true
